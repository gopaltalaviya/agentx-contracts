[profile.default]
src            = "src"
out            = "out"
libs           = ["lib"]
test           = "test"
script         = "script"
solc_version   = "0.8.26"
optimizer      = true
optimizer_runs = 200
via_ir         = true   # ERC-8004's 11-arg NewFeedback event overflows the stack without it
bytecode_hash  = "none"        # no metadata hash: the bytecode depends on the source alone
evm_version    = "cancun"      # pinned, not inherited from the compiler default

# Deploy.s.sol reads config/ and writes deployments/
fs_permissions = [
  { access = "read",       path = "./config" },
  { access = "read-write", path = "./deployments" },
  { access = "read",       path = "./out" },
]

[profile.ci]
verbosity  = 3
fuzz       = { runs = 10_000 }
invariant  = { runs = 512, depth = 64, fail_on_revert = false }

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs           = 64
depth          = 32
fail_on_revert = false

[fmt]
line_length          = 100
tab_width            = 4
bracket_spacing      = false
int_types            = "long"
sort_imports         = true

# Network aliases. Values come from env; the registry in config/networks.json
# is the documentation of what they should be.
[rpc_endpoints]
anvil         = "http://127.0.0.1:8545"
monad_testnet = "${RPC_URL_10143}"
monad         = "${RPC_URL_143}"

# Explorer verification.
#
# Every entry here is validated when forge starts, whichever verifier a
# command actually asks for — so an entry without a `url` made EVERY
# `forge verify-contract` fail with "No known Etherscan API URL for chain
# 143", including ones explicitly passing --verifier sourcify. The URLs are
# required, not optional.
[etherscan]
monad_testnet = { key = "${EXPLORER_API_KEY}", chain = 10143, url = "https://testnet.monadexplorer.com/api" }
monad         = { key = "${EXPLORER_API_KEY}", chain = 143, url = "https://monadexplorer.com/api" }
