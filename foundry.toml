[profile.default]
src            = "src"
out            = "out"
libs           = ["lib"]
test           = "test"
script         = "script"
solc_version   = "0.8.26"
optimizer      = true
optimizer_runs = 200
via_ir         = false
bytecode_hash  = "none"        # deterministic bytecode -> CREATE2 gives the same address on every chain

# Deploy.s.sol reads config/ and writes deployments/
fs_permissions = [
  { access = "read",       path = "./config" },
  { access = "read-write", path = "./deployments" },
  { access = "read",       path = "./out" },
]

[profile.ci]
verbosity  = 3
fuzz       = { runs = 10_000 }
invariant  = { runs = 512, depth = 64, fail_on_revert = false }

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs           = 64
depth          = 32
fail_on_revert = false

[fmt]
line_length          = 100
tab_width            = 4
bracket_spacing      = false
int_types            = "long"
sort_imports         = true

# Network aliases. Values come from env; the registry in config/networks.json
# is the documentation of what they should be.
[rpc_endpoints]
anvil         = "http://127.0.0.1:8545"
monad_testnet = "${RPC_URL_10143}"
monad         = "${RPC_URL_143}"

[etherscan]
monad_testnet = { key = "${EXPLORER_API_KEY}", chain = 10143 }
monad         = { key = "${EXPLORER_API_KEY}", chain = 143 }
